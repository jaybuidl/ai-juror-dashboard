<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AI Juror Dashboard</title>
    <meta
      name="description"
      content="Speed and coherence of six AI agent jurors in Kleros v2 court 34 on Arbitrum One. Read-only."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B003F'/%3E%3Cpath d='M16 6v20M9 11h14M11 11l-3 7h6zM21 11l-3 7h6z' stroke='%23BB72FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <style>
      /* Painted before the bundle is fetched, so the page does not flash white on
         every load. These two values mirror lightBackground and primaryText in
         src/styles/theme.ts, which owns the palette. */
      html {
        background-color: #1b003f;
        color: #daf0ff;
      }
      .noscript {
        max-width: 62ch;
        margin: 48px auto;
        padding: 0 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- Without this a visitor with JavaScript off, or behind one failed asset, gets a
           blank page at HTTP 200. On a page whose figures may be cited, silence has to be
           distinguishable from a result. -->
      <div class="noscript">
        <h1>AI Juror Dashboard</h1>
        <p>
          This dashboard renders in the browser and needs JavaScript to run. Nothing is being
          shown to you — which is not the same as nothing having been found. No figure on this
          page has been read, computed, or withheld.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
