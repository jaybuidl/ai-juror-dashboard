# Build configuration for the AI Juror Dashboard.
#
# Settings here override anything entered in the Netlify UI, so this file is the single
# source of truth: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# Node version is deliberately NOT set here. Netlify's precedence is
# .nvmrc > .node-version > NODE_VERSION > UI, so .nvmrc (which pins 22) already wins and
# a second declaration would only be a decoy.
# https://docs.netlify.com/build/configure-builds/available-software-at-build-time/
#
# Yarn comes from the `packageManager` field in package.json via corepack, and requires the
# committed .yarnrc.yml with `nodeLinker: node-modules` — Netlify does not support PnP.
# Because Netlify sets CI=true, Yarn enforces --immutable itself: an out-of-date yarn.lock
# fails the build rather than being silently rewritten.
# https://docs.netlify.com/build/configure-builds/manage-dependencies/

[build]
  # `build:ci`, not `build`: it lints and runs the tests as well as type-checking.
  # .github/workflows/ci.yml runs those same checks on pull requests and on master, so this
  # is no longer the only place they run — but it stays the last gate between a change and a
  # public page, and a workflow can be disabled, skipped, or bypassed by a direct push.
  # Verifying twice costs a minute; deploying something no one verified costs more.
  command = "yarn build:ci"
  publish = "dist"

# --- Security headers --------------------------------------------------------------
#
# This dashboard is read-only forever: it never votes, stakes, holds a key, or connects
# a wallet. The policy below is written to make that structurally true rather than merely
# intended — `default-src 'none'` and `form-action 'none'` mean a page that started
# submitting anything would break loudly.
#
# EVERY TICKET THAT ADDS A HOST TO THIS PAGE MUST ADD IT HERE, IN THE DIRECTIVE THAT
# GOVERNS IT — not only a data source on connect-src. A stylesheet is style-src, a webfont
# is font-src, a script is script-src, an image is img-src, and default-src 'none' blocks
# whatever is not listed. This warning was scoped to data sources until ticket 14 and would
# have said nothing about a font host. Vite's dev server sends no policy at all, so a missed
# edit here looks perfect under `yarn dev` and `yarn preview` and surfaces only in
# production — as a silent fall back, not as an error.
#
# connect-src is an allowlist of the endpoints the dashboard is permitted to read,
# including any host substituted through a VITE_ override. Ticket 02 added
# ethereum-rpc.publicnode.com for ENS; it is the default behind VITE_MAINNET_RPC_URL, and
# overriding that variable with a host absent from this list blocks ENS at the browser
# rather than at the endpoint.
#
# Ticket 04 added a second subgraph — the dispute resolver template subgraph, for what
# each dispute is about — and added no host: it is on api.goldsky.com, which the core
# subgraph already put here. VITE_DRT_SUBGRAPH_URL is the override, and it is subject to
# this list exactly as the two above are.
#
# style-src and font-src are still 'self' after ticket 14 adopted the Kleros ×AI design
# system, and that is a decision rather than an omission. The system's tokens/fonts.css
# @imports Manrope and JetBrains Mono from fonts.googleapis.com; this repo self-hosts both
# instead (src/styles/webfonts.ts), so the policy did not widen by two hosts to render two
# typefaces. A ticket that reintroduces a remote font needs fonts.googleapis.com on
# style-src AND fonts.gstatic.com on font-src: the stylesheet and the woff2 files it goes on
# to fetch are governed by different directives, and listing only one fails silently.
#
# img-src allows arbitrary https hosts because ENS avatars for the six agent jurors
# resolve to URLs this repo does not control.
#
# euc.li is in connect-src, not just covered by img-src, and the difference is not
# obvious: viem's getEnsAvatar issues a HEAD request to the avatar URL to check its
# content type before ever handing it to an <img>. That fetch is governed by connect-src.
# Blocked, it does not fail visibly — viem catches the error and falls back to loading the
# URL as an Image, which img-src permits — so the avatar still appears and the only trace
# is a console violation on every load. That is precisely the failure this policy is meant
# to make loud, so the host is listed rather than left to degrade quietly.
#
# All six records are plain https URLs on euc.li today. That is a property of the records,
# not a guarantee: one re-pointed at an ipfs:// URI or an eip155 NFT would have viem fetch
# a gateway (ipfs.io) or token metadata first, and would need that host added here too.
#
# There is no frame-src clause: the dashboard embeds nothing, and default-src 'none'
# already denies it. frame-ancestors 'none' plus X-Frame-Options means Netlify's
# deploy-preview Drawer cannot embed the site either — accepted, in exchange for a
# policy with no capability in it that the product does not use.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """
default-src 'none'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: https:; \
font-src 'self' data:; \
connect-src 'self' https://api.goldsky.com https://arb1.arbitrum.io https://ethereum-rpc.publicnode.com https://euc.li; \
base-uri 'self'; \
form-action 'none'; \
frame-ancestors 'none'"""

# Vite emits content-hashed filenames under /assets, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- SPA fallback ------------------------------------------------------------------
#
# Must stay last: the redirect engine takes the first matching rule. Deliberately
# unforced — Netlify serves a real file in preference to an unforced rewrite, so the
# hashed bundles under /assets/ are not shadowed by the app shell. Every other unknown
# path does return the shell at HTTP 200. Ticket 15 added the real routes — /disputes,
# /agent-jurors and /method — and the 404 view behind them, which is the only thing that can
# tell a visitor their URL is wrong now that every path answers 200. Tickets 09 and 11 add
# their views under those same two indexes and need nothing new here. The router is a
# BrowserRouter and this rule is what makes a pasted link to any of them resolve; a hash
# router would not have needed it, and would have put a `#` in every URL this page is cited by.
#
# Known and deliberately not fixed here: a MISSING /assets/* file also returns the shell
# at 200 with Content-Type text/html. If a browser ever held a stale index.html pointing
# at a purged bundle, the script fetch would get HTML, fail the nosniff MIME check, and
# render a blank page that the <noscript> block does not cover. Netlify's deploys are
# atomic and it does not long-cache HTML, so this is narrow — but a `/assets/* -> 404`
# rule ahead of this one is the fix if it ever shows up. It is omitted because it cannot
# be verified against real Netlify from here, and getting it wrong 404s every asset.
# https://docs.netlify.com/manage/routing/redirects/rewrites-proxies/
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
